name: checks

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    checks:
        name: ${{ matrix.os }} / Node ${{ matrix.node }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                node: [24.0.0, 24, 26]
        steps:
            - name: Check out source
              uses: actions/checkout@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  persist-credentials: false
            - name: Select Node
              uses: actions/setup-node@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - name: Restore pinned dependencies
              run: npm ci --ignore-scripts
            - name: Typecheck and test native source plus production-only checkouts offline
              env:
                  NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/network-block.mjs
              run: npm run check
            - name: Verify generated schemas and catalog
              env:
                  NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/network-block.mjs
              run: npm run schemas -- --check
